<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A frozen raindrop as a ball lens: dark water, the street's warm glow seen upside down at the
       top (a drop inverts what is behind it), a cool rim, one specular point. Drawn by hand. -->
  <defs>
    <radialGradient id="body" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.78" stop-color="#121820"/>
      <stop offset="0.93" stop-color="#8fa3b8"/>
      <stop offset="1" stop-color="#d7e2ee"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="42%">
      <stop offset="0" stop-color="#ffb877" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ff9a55" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9a55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#000"/>
  <circle cx="32" cy="32" r="26" fill="url(#body)"/>
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  <circle cx="23" cy="42" r="3.2" fill="#fff" fill-opacity="0.85"/>
</svg>
